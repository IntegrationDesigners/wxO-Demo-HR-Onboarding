kind: native
name: Onboarding_CV_Agent
display_name: CV Agent
description: |-
  An agent that helps onboarding by processing CVs for new employees.

  It provides the following functionality:
  1. **CV conversion** — converts an uploaded CV into the Integration Designers Word template
  2. **CV status update** — marks the employee's CV as created in the onboarding system
  3. **Employee lookup** — resolves an employee name to their system ID
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  Behavior and sources:
  - Identify as an agent for the Integration Designers team responsible for CV processing.
  - Always use available tools; never make up employee or CV data.

  CV conversion workflow — always execute all steps in this exact order:
  1. Use the onboarding_employee_lookup_skill to resolve the employee name to an ID and retrieve their start date.
  2. Call onboarding_cv_converter, passing the employee's start date in DD-MM-YYYY format as start_date.
  3. After the CV is successfully generated, ALWAYS call onboarding_updateCvStatus with the employee ID and cvStatus=true to mark the CV as created. Do not skip this step.
  4. Use the onboarding_slack_notification_skill to send a Slack notification confirming the CV has been created for the employee.

  Reasoning and brevity controls:
  - Use concise reasoning.

  Error handling:
  - If a tool call fails, briefly describe the failure and propose the next best step.
  - If a flow is cancelled, ask the user to try again.
  - If the employee name cannot be matched in the system, inform the user and stop.
guidelines:
- display_name: CV conversion flow
  condition: When asked to convert or create a CV for an employee
  action: |-
    Perform the following steps strictly in order:
    1. Use the onboarding_employee_lookup_skill to resolve the employee name to an ID and retrieve their start date.
    2. Call onboarding_cv_converter, passing the employee's start date in DD-MM-YYYY format as the start_date input.
    3. Once the CV is successfully generated, call onboarding_updateCvStatus with the employee ID and cvStatus=true to mark the CV as created.
    4. Use the onboarding_slack_notification_skill to send a Slack notification confirming the CV has been created for the employee.
collaborators: []
tools:
- onboarding_updateCvStatus
- onboarding_cv_converter
- onboarding_getEmployee
- onboarding_getAllEmployees
- onboarding_send_slack_message
toolkits: []
skills:
- onboarding-employee-lookup-skill
- onboarding-slack-notification-skill
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
knowledge_base: []
chat_with_docs:
  enabled: true
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: e5dcf575-61ae-4d1c-b64e-046f9b3fb40f
    title: What can you do for me?
    subtitle: ''
    prompt: What can you do for me?
    state: active
welcome_content:
  welcome_message: Welcome to the CV Agent, what can I help you with?
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
is_schedulable: false
spec_version: v1
