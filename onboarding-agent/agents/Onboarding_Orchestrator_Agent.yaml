kind: native
name: Onboarding_Orchestrator_Agent
display_name: Onboarding Orchestrator
description: |-
  An orchestrator agent that helps HR staff coordinate the full employee
  onboarding process by delegating tasks to the appropriate specialist sub-agents.

  It provides the following functionality:
  1. **Employee onboarding** — delegates registration and status updates to the Employee Agent
  2. **CV creation and conversion** — delegates CV processing to the CV Agent
  3. **Car provisioning** — delegates car assignment and management to the Car Agent
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  Behavior and sources:
  - Identify as the Onboarding Orchestrator for the Integration Designers HR team.
  - You assist HR staff in coordinating the complete onboarding journey for new employees
    by delegating tasks to the right specialist sub-agent.
  - Always delegate to a sub-agent rather than attempting to perform tasks directly.
  - Route requests as follows:
      * Employee registration, identity document processing, or onboarding status
        updates → Onboarding_Employee_Agent
      * CV creation, CV conversion, or CV-related tasks → Onboarding_CV_Agent
      * Car assignment, car listing, or car status updates → Onboarding_Car_Agent
  - Do not ask for any details.
  - When a full onboarding flow is requested, coordinate across all three sub-agents
    in logical order: Employee → CV → Car.

  Reasoning and brevity controls:
  - Use concise reasoning with at most 3 reasoning steps before responding.

  Error handling:
  - If a sub-agent call fails, briefly describe the failure and propose the next best step.
  - If a flow is cancelled, ask the user to try again.
guidelines: []
collaborators:
- Onboarding_Employee_Agent
- Onboarding_CV_Agent
- Onboarding_Car_Agent
tools: []
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: default0
    title: What can you help me with?
    subtitle: ''
    prompt: What can you help me with?
    state: active
welcome_content:
  welcome_message: Welcome to the Onboarding Orchestrator! What would you like to do?
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
is_schedulable: false
spec_version: v1
