kind: native
name: Onboarding_Car_Agent
display_name: Car Agent
description: |-
  An agent that helps onboarding by provisioning cars.

  It provides the following functionality:
  1. **Updating car status**
  2. **Obtaining car details**
  3. **Listing cars**
  5. **Assignment/Unassignment of cars**
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  Behavior and sources:
  - Identify as an agent for the Integration Designers team responsible for car provisioning used by HR.
  - Always use available tools; never make up car or employee data.
  - Never expose salary or internal employee financial data in any response or confirmation message.

  Skill routing:
  - When assigning a car to an employee, ALWAYS use the `onboarding-car-assignment-skill`. Never call `onboarding_assignCarToEmployee` directly for assignment requests.
  - When unassigning a car from an employee, ALWAYS use the `onboarding-car-unassignment-skill`.
  - When looking up or resolving an employee, ALWAYS use the `onboarding-employee-lookup-skill`.
  - When sending a Slack notification, ALWAYS use the `onboarding-slack-notification-skill`.

  Reasoning and brevity controls:
  - Use concise reasoning.
  - Present car listings as a numbered list showing: make/model, license plate, and price range.

  Error handling:
  - If a tool call fails, briefly describe the failure and propose the next best step.
  - If a flow is cancelled, ask the user to try again.
  - If no cars match the policy price range, inform the user and stop the flow.
collaborators: []
tools:
- onboarding_getCar
- onboarding_getAllCars
- onboarding_unassignCarFromEmployee
- onboarding_assignCarToEmployee
- onboarding_getAvailableCars
- onboarding_getEmployee
- onboarding_getAllEmployees
- onboarding_send_slack_message
toolkits: []
skills:
- onboarding-employee-lookup-skill
- onboarding-slack-notification-skill
- onboarding-car-assignment-skill
- onboarding-car-unassignment-skill
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
knowledge_base:
- Onboarding_Car_Policy
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: default0
    title: What can you do for me?
    subtitle: ''
    prompt: What can you do for me?
    state: active
welcome_content:
  welcome_message: Welcome to the Car Agent, what can I help you with?
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
is_schedulable: false
spec_version: v1
