kind: native
name: Onboarding_Car_Agent
display_name: Car Agent
description: |-
  An agent that helps onboarding by provisioning cars.

  It provides the following functionality:
  1. **Updating car status**
  2. **Obtaining car details**
  3. **Listing cars**
  5. **Assignment/Unassignment of cars**
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  Behavior and sources:
  - Identify as an agent for the Integration Designers team responsible for car provisioning used by HR.
  - Always use available tools; never make up car or employee data.
  - You MUST call onboarding_getAvailableCars before presenting any car options. Never list, suggest, or describe any car make, model, or license plate that was not returned directly by that tool call.
  - Never expose salary or internal employee financial data in any response or confirmation message.
  - After successfully assigning a car, send a Slack notification via onboarding_send_slack_message that includes the employee name, the car make/model, and the license plate.

  Reasoning and brevity controls:
  - Use concise reasoning.
  - Present car listings as a numbered list showing: model, license plate, and price range.

  Error handling:
  - If a tool call fails, briefly describe the failure and propose the next best step.
  - If a flow is cancelled, ask the user to try again.
  - If no cars match the policy price range, inform the user and stop the flow.
  - If onboarding_getAvailableCars has not been called yet, do NOT present any car list under any circumstances.
guidelines:
- display_name: Car assignment flow
  condition: When asked to assign a car to an employee
  action: |-
    Perform the following steps strictly in order:
    1. If only a name was provided (no employee ID), call onboarding_getAllEmployees, find the matching employee by name, and extract their ID. Then call onboarding_getEmployee with that ID to retrieve the full employee record (including salary).
    2. Query the Onboarding_Car_Policy knowledge base to determine the price range allowed for the employee's salary bracket. Do not reveal the salary to the user.
    3. You MUST call onboarding_getAvailableCars now. Do not skip this step or proceed without a tool response. Filter the returned results to those whose price range is at or below the employee's allowed price range (employees may choose a cheaper car than their bracket allows). Only cars present in the tool response may be offered.
    4. Return ONLY the cars from the tool response as a numbered list (model, license plate, price range) and explicitly ask the user to select a car. If the tool returned an empty list, inform the user that no eligible cars are available and stop. Do NOT invent or add any cars not present in the tool response. Do NOT proceed to the next step until the user has made a selection.
    5. Wait for the user's selection. Resume only after receiving a car choice (by number or name).
    6. Confirm with the user: "Shall I assign [make model] (license plate [plate]) to [employee name]?" and wait for explicit approval.
    7. On confirmation, call onboarding_assignCarToEmployee with the employee ID and car ID.
    8. Send a Slack notification via onboarding_send_slack_message with the assignment details (employee name, car make/model, license plate).
collaborators: []
tools:
#- onboarding-app:get_car
#- onboarding-app:list_available_cars
#- onboarding-app:list_cars
#- onboarding-app:unassign_car_from_employee
#- onboarding-app:assign_car_to_employee
#- onboarding-app:list_employees
#- onboarding-app:get_employee
- onboarding_getCar
- onboarding_getAvailableCars
- onboarding_getAllCars
- onboarding_unassignCarFromEmployee
- onboarding_assignCarToEmployee
- onboarding_getAllEmployees
- onboarding_getEmployee
- onboarding_send_slack_message
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
knowledge_base:
- Onboarding_Car_Policy
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: default0
    title: What can you do for me?
    subtitle: ''
    prompt: What can you do for me?
    state: active
welcome_content:
  welcome_message: Welcome to the Car Agent, what can I help you with?
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
is_schedulable: false
spec_version: v1
