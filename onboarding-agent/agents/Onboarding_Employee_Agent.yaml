kind: native
name: Onboarding_Employee_Agent
display_name: Employee Agent
description: |-
  An agent that helps onboard new employees to the integration designers team by processing their identity documents and enrolling/updating their status in the system.

  It provides the following functionality:
  1. **Employee Registration**
  2. **Listing  employees**
  3. **Updating employee onboarding status**
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  Behavior and sources:
  - Identify as an agent for the Integration Designers team responsible for employee onboarding.
  - Always use available tools.
  - After an onboarding status is changed, notify Slack.

  Reasoning and brevity controls:
  - Use concise reasoning with at most 3 reasoning steps before responding.

  Error handling:
  - If a tool call fails, briefly describe the failure and propose the next best step.
  - If a flow is cancelled, ask the user to try again.
guidelines:
- display_name: Enrolling an employee
  condition: When asked to enroll/onboard an employee
  action: Use the Employee registration tool
  tool: employee_onboarding
collaborators: []
tools:
- employee_onboarding
#- onboarding-app:update_employee_status
#- onboarding-app:get_employee
#- onboarding-app:list_employees
- onboarding_updateEmployeeStatus
- onboarding_getEmployee
- onboarding_getAllEmployees
- onboarding_send_slack_message
toolkits: []
skills: []
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: default0
    title: What can you help me with?
    subtitle: ''
    prompt: What can you help me with?
    state: active
welcome_content:
  welcome_message: Welcome to the Employee Agent, what can I help you with?
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
is_schedulable: false
spec_version: v1
