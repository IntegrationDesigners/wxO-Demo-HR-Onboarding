kind: native
name: Onboarding_Employee_Agent
display_name: Employee Agent
description: |-
  An agent that helps onboard new employees to the Integration Designers team by processing their identity documents and enrolling them in the system.

  It provides the following functionality:
  1. **Employee registration** — runs the guided onboarding flow to register a new employee
  2. **Employee lookup** — retrieves a single employee or lists all employees
  3. **Onboarding status reset** — clears CV or car provisioning status for an employee
context_access_enabled: true
context_variables: []
restrictions: editable
memory_enabled: false
supported_apps: []
llm: groq/openai/gpt-oss-120b
style: react_core
hide_reasoning: false
instructions: |-
  Behavior and sources:
  - Identify as an agent for the Integration Designers team responsible for employee onboarding.
  - Always use available tools; never make up employee data.

  Reasoning and brevity controls:
  - Use concise reasoning.

  Error handling:
  - If a tool call fails, briefly describe the failure and propose the next best step.
  - If a flow is cancelled, ask the user to try again.
  - If the employee is not found, inform the user and stop.
guidelines:
- display_name: Employee registration flow
  condition: When asked to register, enroll, or onboard a new employee
  action: |-
    Call the employee_onboarding flow. This is a self-contained interactive flow that guides the user through all required registration steps — do not collect any information before invoking it and do not perform any additional steps afterwards.
  tool: employee_onboarding
collaborators: []
tools:
- employee_onboarding
- onboarding_getEmployee
- onboarding_getAllEmployees
- onboarding_updateEmployeeStatus
- onboarding_send_slack_message
toolkits: []
skills:
- onboarding-employee-lookup-skill
- onboarding-slack-notification-skill
- onboarding-status-reset-skill
plugins:
  agent_pre_invoke: []
  agent_post_invoke: []
sync_tool_flow_interactions: true
knowledge_base: []
chat_with_docs:
  enabled: false
  supports_full_document: true
  vector_index:
    chunk_size: 400
    chunk_overlap: 50
    limit: 10
    extraction_strategy: express
  generation:
    prompt_instruction: ''
    max_docs_passed_to_llm: 5
    generated_response_length: Moderate
    display_text_no_results_found: I searched my knowledge base, but did not find
      anything related to your query
    display_text_connectivity_issue: I might have information related to your query
      to share, but am unable to connect to my knowledge base at the moment
    idk_message: I'm afraid I don't understand. Please rephrase your question.
    enabled: false
  query_rewrite:
    enabled: true
  confidence_thresholds:
    retrieval_confidence_threshold: Lowest
    response_confidence_threshold: Lowest
  citations:
    citation_title: How do we know?
    citations_shown: -1
  hap_filtering:
    output:
      enabled: false
      threshold: 0.5
  query_source: Agent
  agent_query_description: The query to search for in the knowledge base
starter_prompts:
  is_default_prompts: false
  prompts:
  - id: default0
    title: What can you help me with?
    subtitle: ''
    prompt: What can you help me with?
    state: active
welcome_content:
  welcome_message: Welcome to the Employee Agent, what can I help you with?
  description: Accuracy of generated answers may vary. Please double-check responses.
  is_default_message: false
is_schedulable: false
spec_version: v1
